name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache de dependências
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Criar diretórios necessários
      run: |
        mkdir -p app/modelo
        mkdir -p uploads
        mkdir -p results
        mkdir -p mlruns
    
    - name: Rodar testes unitários
      run: |
        pytest tests/test_preprocessing.py tests/test_model.py -v --tb=short --disable-warnings
    
    - name: Rodar testes com cobertura
      run: |
        pytest tests/ --cov=app --cov=src --cov-report=xml --cov-report=term-missing
    
    - name: Upload cobertura para Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar flake8
      run: |
        pip install flake8
    
    - name: Lint - Erros críticos
      run: |
        flake8 app/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Lint - Qualidade de código
      run: |
        flake8 app/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker-compose build --no-cache
    
    - name: Verificar se imagem foi criada
      run: |
        docker images | grep pedras-ml-api
    
    - name: Test Docker container startup
      run: |
        docker-compose up -d
        sleep 15
        docker-compose ps
    
    - name: Test API health endpoint
      run: |
        curl -f http://localhost:8000/health || exit 1
    
    - name: Cleanup
      if: always()
      run: |
        docker-compose down -v
