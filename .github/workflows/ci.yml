name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Cache de dependências
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Criar diretórios necessários
      run: |
        mkdir -p app/modelo
        mkdir -p uploads
        mkdir -p results
        mkdir -p mlruns
    
    - name: Rodar testes unitários
      run: |
        pytest tests/test_preprocessing.py tests/test_model.py -v --tb=short --disable-warnings
    
    - name: Rodar testes com cobertura
      run: |
        pytest tests/ --cov=app --cov=src --cov-report=xml --cov-report=term-missing
    
    - name: Upload cobertura para Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Instalar flake8
      run: |
        pip install flake8
    
    - name: Lint - Erros críticos
      run: |
        flake8 app/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Lint - Qualidade de código
      run: |
        flake8 app/ src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
